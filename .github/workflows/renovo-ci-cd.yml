
# What this code does?
# Automatically tests the Renovo login functionality.
# If the tests pass, it packages the application for delivery.

name: Renovo CI-CD

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest

    steps:
      # 1. Download the latest repository code.
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Set up Python.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # 3. Install the project dependencies.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      # 4. Run automated tests.
      - name: Run login unit tests
        run: |
          python -m pytest -v test_login.py

      # 5. Package the application only after tests pass.
      - name: Package Renovo application
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          excluded_dirs = {
              ".git", ".github", ".venv", "venv",
              "__pycache__", ".pytest_cache",
              "large_dataset_evidence", "Database"
          }

          with ZipFile("Renovo-Tested-Build.zip", "w", ZIP_DEFLATED) as archive:
              for path in Path(".").rglob("*"):
                  if not path.is_file():
                      continue
                  if any(part in excluded_dirs for part in path.parts):
                      continue
                  if path.suffix in {".db", ".pyc"}:
                      continue
                  if path.name == "Renovo-Tested-Build.zip":
                      continue
                  archive.write(path)

          print("Renovo delivery package created.")
          PY

      # 6. Upload the tested application as a build artefact.
      - name: Upload Renovo build
        uses: actions/upload-artifact@v4
        with:
          name: Renovo-Tested-Build
          path: Renovo-Tested-Build.zip
          if-no-files-found: error
