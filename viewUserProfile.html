
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View User Profile</title>
</head>
<body>

    <h1>View User Profile</h1>

    <!-- Display a success message after updating a profile -->
    <p id="successMessage" hidden>
        User profile updated successfully.
    </p>

    <!-- Return to the User Profiles management page -->
    <button onclick="window.location.href='/user-admin/profiles'">
        Back to User Profiles
    </button>

    <br><br>

    <!-- Display the selected user profile details -->
    <h2>{{ profile.profile_name }}</h2>

    <p>
        <strong>Description:</strong>
        {{ profile.description }}
    </p>

    <p>
        <strong>Status:</strong>
        {{ profile.status }}
    </p>

    <p>
        <strong>Created At:</strong>
        {{ profile.created_at }}
    </p>

    <p>
        <strong>Last Updated:</strong>
        {{ profile.updated_at }}
    </p>

    <br>

    <!-- Navigate to the Update User Profile page -->
    <button onclick="window.location.href='/user-admin/profiles/{{ profile.id }}/edit'">
        Edit
    </button>

    <!-- Suspend and Reactivate will be implemented in US6 -->
    {% if profile.status == "Active" %}
        <button type="button" disabled>
            Suspend
        </button>
    {% else %}
        <button type="button" disabled>
            Reactivate
        </button>
    {% endif %}

    <script>
        // Check whether the user profile was just updated
        const params = new URLSearchParams(window.location.search);

        if (params.get("updated") === "1") {
            document.getElementById("successMessage").hidden = false;

            // Remove the success indicator from the URL
            window.history.replaceState(
                {},
                "",
                window.location.pathname
            );
        }
    </script>

</body>
</html>
