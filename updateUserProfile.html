
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update User Profile</title>
</head>
<body>

    <h1>Update User Profile</h1>

    <form id="updateProfileForm">

        <!-- Display the existing profile name -->
        <label for="profile_name">Profile Name:</label>
        <input
            type="text"
            id="profile_name"
            value="{{ profile.profile_name }}"
        >
        <br><br>

        <!-- Display the existing profile description -->
        <label for="description">Description:</label>
        <textarea id="description">{{ profile.description }}</textarea>
        <br><br>

        <button type="submit">Save Changes</button>

        <!-- Return to View User Profile without saving -->
        <button type="button" id="cancelButton">
            Cancel
        </button>

    </form>

    <p id="message"></p>

    <script>
        const form = document.getElementById("updateProfileForm");
        const message = document.getElementById("message");

        // Use the selected profile's ID for the update request
        const profileId = {{ profile.id | tojson }};

        // Return to View User Profile without saving changes
        document.getElementById("cancelButton").addEventListener(
            "click",
            function() {
                window.location.href = "/user-admin/profiles/" + profileId;
            }
        );

        // Handle the Update User Profile form submission
        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const profileDetails = {
                profile_name: document.getElementById("profile_name").value,
                description: document.getElementById("description").value
            };

            // Send the updated details to the Flask Boundary
            try {
                const response = await fetch(
                    "/user-admin/profiles/" + profileId + "/edit",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(profileDetails)
                    }
                );

                const result = await response.json();

                if (response.ok && result.success) {
                    // Return to View User Profile after a successful update
                    window.location.href =
                        "/user-admin/profiles/" + profileId + "?updated=1";
                } else {
                    // Display the error and preserve the entered details
                    message.textContent = result.message;
                }

            } catch (error) {
                message.textContent = "Unable to connect to the server.";
            }
        });
    </script>

</body>
</html>
