
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create User Profile</title>
</head>
<body>

    <h1>Create User Profile</h1>

    <!-- Return to User Profiles, confirming unsaved changes -->
    <button type="button" id="backButton">
        Back to User Profiles
    </button>

    <br><br>

    <form id="createProfileForm">

        <label for="profile_name">Profile Name:</label>
        <input type="text" id="profile_name">
        <br><br>

        <label for="description">Description:</label>
        <textarea id="description"></textarea>
        <br><br>

        <button type="submit">Save Profile</button>

        <button type="button" onclick="window.location.href='/user-admin/profiles'">
            Cancel
        </button>

    </form>

    <p id="message"></p>

    <script>
        const form = document.getElementById("createProfileForm");
        const message = document.getElementById("message");

        // Confirm before leaving if the form contains unsaved changes
        document.getElementById("backButton").addEventListener("click", function() {
            const profileName = document.getElementById("profile_name").value;
            const description = document.getElementById("description").value;

            if (profileName.trim() || description.trim()) {
                const discard = confirm("Discard unsaved changes?");

                if (!discard) {
                    return;
                }
            }

            window.location.href = "/user-admin/profiles";
        });

        // Handle the Create User Profile form submission
        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const profileDetails = {
                profile_name: document.getElementById("profile_name").value,
                description: document.getElementById("description").value
            };

            // Send the profile details to the Flask Boundary
            try {
                const response = await fetch("/user-admin/profiles", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(profileDetails)
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    // Redirect to the profile list with a success indicator
                    window.location.href = "/user-admin/profiles?created=1";
                } else {
                    // Display the error and preserve the entered details
                    message.textContent = result.message;
                }

            } catch (error) {
                message.textContent = "Unable to connect to the server.";
            }
        });
    </script>

</body>
</html>
