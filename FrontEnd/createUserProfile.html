
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renovo | Create User Profile</title>

    <style>
        :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: #26344a; background: #f4f6fb; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; }
        button, input, textarea { font: inherit; }

        /* Top navigation bar */
        .topbar { height: 76px; background: #14253e; color: white; display: flex; justify-content: space-between; align-items: center; padding: 0 36px; border-bottom: 1px solid #ffffff20; }
        .brand { font-size: 24px; font-weight: 850; letter-spacing: .07em; }
        .brand span { color: #8dded4; }
        .topbar-right { display: flex; align-items: center; gap: 24px; }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .user-avatar { height: 38px; width: 38px; border-radius: 50%; background: #2d5272; display: flex; justify-content: center; align-items: center; color: #8dded4; font-weight: 700; font-size: 15px; }
        .user-details { display: flex; flex-direction: column; gap: 3px; }
        .user-details strong { font-size: 13px; font-weight: 650; }
        .user-details small { font-size: 11px; color: #d1deec; }
        .logout-button { background: transparent; border: 1px solid #ffffff55; border-radius: 8px; color: white; font-size: 13px; font-weight: 600; padding: 10px 16px; cursor: pointer; }
        .logout-button:hover { background: #ffffff18; }

        /* Main layout and sidebar */
        .dashboard-layout { display: grid; grid-template-columns: 245px minmax(0, 1fr); min-height: calc(100vh - 76px); }
        .sidebar { background: white; border-right: 1px solid #e4e9f2; padding: 32px 16px; }
        .sidebar-title { color: #8290a3; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; margin: 0 14px 18px; }
        .sidebar-nav { display: flex; flex-direction: column; gap: 8px; }
        .nav-link { display: flex; align-items: center; gap: 13px; padding: 14px 16px; border-radius: 9px; text-decoration: none; color: #52647a; font-size: 14px; font-weight: 550; transition: background .2s, color .2s; }
        .nav-link svg { width: 20px; height: 20px; flex-shrink: 0; }
        .nav-link:hover { background: #f0f5f7; color: #1c5062; }
        .nav-link.active { background: #e6f3f3; color: #1c5062; font-weight: 750; }

        /* Main content */
        .main-content { padding: 46px 50px; width: 100%; max-width: 1450px; }
        .back-link { display: inline-flex; align-items: center; gap: 8px; background: none; border: none; padding: 0; margin-bottom: 28px; color: #387c83; font-size: 13px; font-weight: 700; cursor: pointer; }
        .back-link:hover { color: #1c5062; text-decoration: underline; }
        .page-title { color: #14253e; font-size: 32px; font-weight: 750; letter-spacing: -.03em; margin: 0 0 10px; }
        .page-description { color: #738096; font-size: 14px; line-height: 1.6; margin: 0 0 32px; }

        /* Create profile form */
        .form-panel { width: 100%; max-width: 760px; background: white; border: 1px solid #e4e9f2; border-radius: 14px; padding: 34px; box-shadow: 0 8px 28px #1c34500a; }
        .field { margin-bottom: 24px; }
        .field label { display: block; margin-bottom: 9px; font-size: 13px; font-weight: 700; color: #26344a; }
        .required { color: #b9434e; margin-left: 3px; }
        .control { width: 100%; height: 46px; padding: 0 14px; border: 1px solid #cdd7e4; border-radius: 8px; outline: none; background: white; color: #26344a; font-size: 14px; }
        .control::placeholder { color: #9aa6b5; }
        .control:focus { border-color: #2b7b85; box-shadow: 0 0 0 3px #2b7b8522; }
        textarea.control { height: auto; min-height: 145px; padding: 13px 14px; resize: vertical; line-height: 1.6; }
        .form-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 30px; padding-top: 22px; border-top: 1px solid #edf0f5; }
        .cancel-button { min-width: 105px; height: 44px; border: 1px solid #cdd7e4; border-radius: 8px; background: white; color: #52647a; font-size: 13px; font-weight: 700; cursor: pointer; }
        .cancel-button:hover { background: #f0f4f8; }
        .submit-button { min-width: 160px; height: 44px; padding: 0 18px; border: none; border-radius: 8px; background: #1c5062; color: white; font-size: 13px; font-weight: 700; cursor: pointer; }
        .submit-button:hover { background: #256d7f; }
        .submit-button:disabled { opacity: .6; cursor: not-allowed; }

        /* Form messages */
        .message { display: none; margin: 0 0 24px; padding: 13px 16px; border-radius: 8px; font-size: 13px; line-height: 1.5; }
        .message.show { display: block; }
        .message.error { background: #fff0f0; border: 1px solid #f2cbd1; color: #a22735; }
        a:focus-visible, button:focus-visible { outline: 3px solid #8dded4; outline-offset: 3px; }

        /* Tablet layout */
        @media (max-width: 1000px) {
            .dashboard-layout { grid-template-columns: 200px minmax(0, 1fr); }
            .main-content { padding: 36px 28px; }
            .form-panel { padding: 28px; }
        }

        /* Mobile layout */
        @media (max-width: 720px) {
            .topbar { height: auto; min-height: 70px; padding: 16px 20px; }
            .brand { font-size: 21px; }
            .topbar-right { gap: 12px; }
            .user-details { display: none; }
            .logout-button { padding: 9px 12px; }
            .dashboard-layout { display: block; }
            .sidebar { padding: 12px; border-right: none; border-bottom: 1px solid #e4e9f2; }
            .sidebar-title { display: none; }
            .sidebar-nav { flex-direction: row; gap: 6px; overflow-x: auto; }
            .nav-link { padding: 11px 13px; white-space: nowrap; font-size: 12px; }
            .nav-link svg { width: 17px; height: 17px; }
            .main-content { padding: 30px 20px; }
            .page-title { font-size: 26px; }
            .form-panel { padding: 22px; }
            .form-actions { gap: 10px; }
            .cancel-button, .submit-button { min-width: 0; flex: 1; }
        }
    </style>
</head>

<body>

    <!-- Top Navigation Bar -->
    <header class="topbar">
        <div class="brand">
            RENO<span>VO</span>
        </div>

        <div class="topbar-right">
            <div class="user-info">
                <div class="user-avatar">UA</div>

                <div class="user-details">
                    <strong>Hi, {{ username | default("User Admin", true) }}</strong>
                    <small>User Administrator</small>
                </div>
            </div>

            <button class="logout-button" id="logoutButton" type="button">
                Log out
            </button>
        </div>
    </header>

    <div class="dashboard-layout">

        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <p class="sidebar-title">Administration</p>

            <nav class="sidebar-nav">

                <!-- Dashboard -->
                <a class="nav-link"
                   href="/user-admin/dashboard?username={{ username | default('User Admin', true) | urlencode }}">
                    <svg viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="1.8"
                         stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7" rx="1"/>
                        <rect x="14" y="3" width="7" height="7" rx="1"/>
                        <rect x="3" y="14" width="7" height="7" rx="1"/>
                        <rect x="14" y="14" width="7" height="7" rx="1"/>
                    </svg>
                    Dashboard
                </a>

                <!-- User Accounts -->
                <a class="nav-link"
                   href="/user-admin/accounts?username={{ username | default('User Admin', true) | urlencode }}">
                    <svg viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="1.8"
                         stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="8" r="4"/>
                        <path d="M2 21v-2a7 7 0 0 1 14 0v2"/>
                        <path d="M17 4a4 4 0 0 1 0 8"/>
                        <path d="M22 21v-2a7 7 0 0 0-4-6.3"/>
                    </svg>
                    User Accounts
                </a>

                <!-- User Profiles -->
                <a class="nav-link active"
                   href="/user-admin/profiles?username={{ username | default('User Admin', true) | urlencode }}"
                   aria-current="page">
                    <svg viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="1.8"
                         stroke-linecap="round" stroke-linejoin="round">
                        <rect x="4" y="3" width="16" height="19" rx="2"/>
                        <circle cx="12" cy="9" r="3"/>
                        <path d="M8 18h8"/>
                    </svg>
                    User Profiles
                </a>

            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">

            <!-- Back to User Profiles -->
            <button class="back-link" id="backButton" type="button">
                <span aria-hidden="true">←</span>
                Back to User Profiles
            </button>

            <h1 class="page-title">
                Create user profile
            </h1>

            <p class="page-description">
                Enter the details below to create a new Renovo user profile.
            </p>

            <!-- Create User Profile Form -->
            <div class="form-panel">

                <p id="message" class="message"
                   role="status" aria-live="polite"></p>

                <form id="createProfileForm" novalidate>

                    <!-- Profile Name -->
                    <div class="field">
                        <label for="profile_name">
                            Profile Name <span class="required">*</span>
                        </label>

                        <input class="control"
                               id="profile_name"
                               type="text"
                               placeholder="Enter profile name"
                               autocomplete="off"
                               required>
                    </div>

                    <!-- Description -->
                    <div class="field">
                        <label for="description">
                            Description <span class="required">*</span>
                        </label>

                        <textarea class="control"
                                  id="description"
                                  placeholder="Enter profile description"
                                  required></textarea>
                    </div>

                    <!-- Form Buttons -->
                    <div class="form-actions">

                        <button class="cancel-button"
                                id="cancelButton"
                                type="button">
                            Cancel
                        </button>

                        <button class="submit-button"
                                id="submitButton"
                                type="submit">
                            Create profile
                        </button>

                    </div>

                </form>
            </div>

        </main>
    </div>

    <script>
        class CreateUserProfilePage {
            constructor() {
                this.form = document.getElementById("createProfileForm");
                this.profileName = document.getElementById("profile_name");
                this.description = document.getElementById("description");
                this.message = document.getElementById("message");
                this.submitButton = document.getElementById("submitButton");

                // Display-only name passed through the existing URL parameter
                this.username = {{ username | default("User Admin", true) | tojson }};

                this.profilesUrl =
                    "/user-admin/profiles?username=" +
                    encodeURIComponent(this.username);

                this.setupEvents();
            }

            // Set up form and navigation events
            setupEvents() {
                this.form.addEventListener(
                    "submit", event => this.handleCreateProfile(event)
                );

                document.getElementById("backButton").addEventListener(
                    "click", () => this.returnToProfiles()
                );

                document.getElementById("cancelButton").addEventListener(
                    "click", () => this.returnToProfiles()
                );

                document.getElementById("logoutButton").addEventListener(
                    "click", () => this.logout()
                );

                // Confirm before leaving using sidebar navigation
                document.querySelectorAll(".sidebar-nav a").forEach(link => {
                    link.addEventListener("click", event => {
                        if (this.hasUnsavedChanges()) {
                            if (!confirm("Discard unsaved changes?")) {
                                event.preventDefault();
                            }
                        }
                    });
                });
            }

            // Check whether any information has been entered
            hasUnsavedChanges() {
                return Boolean(
                    this.profileName.value.trim() ||
                    this.description.value.trim()
                );
            }

            // Return to the User Profiles listing
            returnToProfiles() {
                if (this.hasUnsavedChanges()) {
                    if (!confirm("Discard unsaved changes?")) {
                        return;
                    }
                }

                window.location.href = this.profilesUrl;
            }

            // Return to the login page
            logout() {
                if (this.hasUnsavedChanges()) {
                    if (!confirm("Discard unsaved changes?")) {
                        return;
                    }
                }

                window.location.href = "/";
            }

            // Display validation or server error messages
            showMessage(text) {
                this.message.textContent = text;
                this.message.className = "message show error";
            }

            // Send profile details to the Flask Boundary
            async handleCreateProfile(event) {
                event.preventDefault();

                const profileDetails = {
                    profile_name: this.profileName.value.trim(),
                    description: this.description.value.trim()
                };

                // Check required fields
                if (!profileDetails.profile_name ||
                    !profileDetails.description) {
                    this.showMessage("Please fill in all required fields.");
                    return;
                }

                this.submitButton.disabled = true;
                this.message.className = "message";

                try {
                    const response = await fetch("/user-admin/profiles", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(profileDetails)
                    });

                    const result = await response.json();

                    if (response.ok && result.success) {
                        // Preserve username and show success on profile list
                        window.location.href =
                            this.profilesUrl + "&created=1";
                    } else {
                        this.showMessage(
                            result.message ||
                            "Unable to create user profile."
                        );
                    }

                } catch (error) {
                    this.showMessage(
                        "Unable to connect to the server."
                    );
                } finally {
                    this.submitButton.disabled = false;
                }
            }
        }

        // Initialise the Create User Profile page
        new CreateUserProfilePage();
    </script>

</body>
</html>
