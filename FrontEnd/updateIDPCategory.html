
<!--
What this code does?
- Display the Update IDP Category page for Platform Manager.
- Show the existing Category ID, Category Name and Status.
- Allow editing of the Category Name only.
- Validate that Category Name is not empty.
- Submit the updated name to the Update IDP Category Boundary.
- Display validation and backend error messages.
- Handle duplicate category names returned by the backend.
- Return to View IDP Category after a successful update.
- Provide a Cancel button without saving changes.
- Connect IDP Category and Report sidebar navigation.
- Preserve account_id and username across pages.
- Log out directly without confirmation.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renovo | Update IDP Category</title>

<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#26344a;background:#f4f6fb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh}
button,input{font:inherit}
button{cursor:pointer}

/* Top Bar */
.topbar{height:76px;padding:0 36px;background:#14253e;color:white;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:24px;font-weight:850;letter-spacing:.07em}
.brand span{color:#8dded4}
.topbar-right,.user-info{display:flex;align-items:center;gap:16px}
.user-avatar{width:38px;height:38px;border-radius:50%;background:#2d5272;color:#8dded4;display:grid;place-items:center;font-size:13px;font-weight:750}
.user-details{display:flex;flex-direction:column;gap:3px}
.user-details strong{font-size:13px}
.user-details small{color:#d1deec;font-size:11px}
.logout-button{padding:10px 16px;border:1px solid #ffffff55;border-radius:8px;background:transparent;color:white;font-size:13px}
.logout-button:hover{background:#ffffff18}

/* Layout */
.dashboard-layout{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:calc(100vh - 76px)}
.sidebar{background:white;border-right:1px solid #e4e9f2;padding:32px 16px}
.sidebar-title{margin:0 14px 18px;color:#8290a3;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.sidebar-nav{display:flex;flex-direction:column;gap:8px}
.nav-link{display:block;padding:14px 16px;border-radius:9px;color:#52647a;font-size:14px;text-decoration:none}
.nav-link:hover{background:#f0f5f7}
.nav-link.active{background:#e6f3f3;color:#1c5062;font-weight:750}
.main-content{padding:42px 50px;min-width:0;width:100%;max-width:1100px}

/* Update Category Panel */
.category-panel{background:white;border:1px solid #e4e9f2;border-radius:14px;padding:30px}
.panel-header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:30px}
.page-title{margin:0;color:#14253e;font-size:27px}
.close-link{color:#28747f;font-size:13px;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.close-link:hover{color:#1c5062}
.section-title{margin:0 0 26px;color:#14253e;font-size:19px}

/* Form Fields */
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.form-group{min-width:0}
.form-label{display:block;margin-bottom:10px;color:#52647a;font-size:13px;font-weight:700}
.required{color:#c43b4a}
.form-input{width:100%;height:45px;padding:0 14px;border:1px solid #dbe2ec;border-radius:8px;background:white;color:#26344a;font-size:13px;outline:none}
.form-input:focus{border-color:#28747f}
.form-input:disabled{background:#f3f6fa;color:#738096;cursor:not-allowed}
.form-input.invalid{border-color:#c43b4a}
.field-error{margin:8px 0 0;color:#b42335;font-size:12px}
.status-badge{display:inline-block;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:750;text-transform:capitalize}
.status-badge.active{background:#e6f6f0;color:#186b4d}
.status-badge.suspended{background:#fff1ed;color:#b45335}
.read-only-field{min-height:45px;padding:12px 14px;border:1px solid #e1e7ef;border-radius:8px;background:#f3f6fa;display:flex;align-items:center}

/* Action Buttons */
.form-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:32px;padding-top:24px;border-top:1px solid #edf0f5}
.action-button{min-width:115px;padding:11px 20px;border:1px solid #dbe2ec;border-radius:8px;background:white;color:#52647a;font-size:13px;font-weight:700}
.action-button:hover{background:#f4f6fb}
.action-button.primary{border-color:#1c5062;background:#1c5062;color:white}
.action-button.primary:hover{background:#256d7f}
.action-button:disabled{opacity:.55;cursor:not-allowed}

/* Messages */
.message{margin-bottom:20px;padding:13px 16px;border-radius:8px;font-size:13px}
.message.success{background:#e6f6f0;color:#186b4d}
.message.error{background:#fff0f0;color:#a22735}
[hidden]{display:none!important}

/* Responsive */
@media(max-width:900px){
.dashboard-layout{grid-template-columns:200px minmax(0,1fr)}
.main-content{padding:32px 25px}
}
@media(max-width:650px){
.topbar{padding:16px 20px}
.user-details{display:none}
.dashboard-layout{display:block}
.sidebar{padding:12px;border-right:none;border-bottom:1px solid #e4e9f2}
.sidebar-title{display:none}
.sidebar-nav{flex-direction:row}
.main-content{padding:28px 18px}
.category-panel{padding:20px}
.form-grid{grid-template-columns:1fr}
.form-actions{flex-wrap:wrap}
}
</style>
</head>

<body>
{% set display_username = username | default("Platform Manager", true) %}

<!-- Top Bar -->
<header class="topbar">
    <div class="brand">RENO<span>VO</span></div>

    <div class="topbar-right">
        <div class="user-info">
            <div class="user-avatar">PM</div>

            <div class="user-details">
                <strong>Hi, {{ display_username }}</strong>
                <small>Platform Manager</small>
            </div>
        </div>

        <button class="logout-button" id="logoutButton" type="button">
            Log out
        </button>
    </div>
</header>

<div class="dashboard-layout">

    <!-- Sidebar -->
    <aside class="sidebar">

        <p class="sidebar-title">Management</p>

        <nav class="sidebar-nav">

            <a class="nav-link active" id="categoryLink" href="#">
                IDP Category
            </a>

            <a class="nav-link" id="reportLink" href="#">
                Report
            </a>

        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">

        <!-- Feedback Message -->
        <div class="message" id="actionMessage"
             role="status" aria-live="polite" hidden></div>

        <section class="category-panel">

            <!-- Page Heading -->
            <div class="panel-header">

                <h1 class="page-title">Update IDP Category</h1>

                <a class="close-link" id="closeCategoryLink" href="#">
                    Close
                </a>

            </div>

            <h2 class="section-title">Category Information</h2>

            <!-- Update Category Form -->
            <form id="updateCategoryForm" novalidate>

                <div class="form-grid">

                    <!-- Category ID -->
                    <div class="form-group">

                        <label class="form-label" for="categoryId">
                            Category ID
                        </label>

                        <input
                            class="form-input"
                            type="text"
                            id="categoryId"
                            value="{{ category.category_id }}"
                            disabled
                        >

                    </div>

                    <!-- Category Name -->
                    <div class="form-group">

                        <label class="form-label" for="categoryName">
                            Category Name <span class="required">*</span>
                        </label>

                        <input
                            class="form-input"
                            type="text"
                            id="categoryName"
                            name="category_name"
                            value="{{ category.category_name }}"
                            placeholder="Enter category name"
                            autocomplete="off"
                            required
                        >

                        <p class="field-error" id="categoryNameError" hidden></p>

                    </div>

                    <!-- Category Status -->
                    <div class="form-group">

                        <label class="form-label">
                            Status
                        </label>

                        <div class="read-only-field">

                            <span class="status-badge {{ category.status | lower }}">
                                {{ category.status }}
                            </span>

                        </div>

                    </div>

                </div>

                <!-- Actions -->
                <div class="form-actions">

                    <button class="action-button" id="cancelButton" type="button">
                        Cancel
                    </button>

                    <button class="action-button primary" id="saveButton" type="submit">
                        Save Changes
                    </button>

                </div>

            </form>

        </section>

    </main>

</div>

<script>
class UpdateIDPCategoryPage {

    constructor() {

        // Existing Category details from Flask Boundary
        this.category = {{ category | tojson }};

        // Navigation information
        this.accountId = {{ account_id | default("", true) | tojson }};
        this.username = {{ display_username | tojson }};

        // Form elements
        this.form = document.getElementById("updateCategoryForm");
        this.categoryNameInput = document.getElementById("categoryName");
        this.categoryNameError = document.getElementById("categoryNameError");
        this.saveButton = document.getElementById("saveButton");
        this.message = document.getElementById("actionMessage");

        this.isSubmitting = false;

        this.setupNavigation();
        this.setupForm();
    }

    // Set up sidebar navigation, Close, Cancel and Logout
    setupNavigation() {

        const params = new URLSearchParams({
            account_id: String(this.accountId),
            username: this.username
        });

        this.categoriesUrl =
            "/platform-manager/categories?" + params.toString();

        this.reportsUrl =
            "/platform-manager/reports?" + params.toString();

        this.viewCategoryUrl =
            `/platform-manager/categories/${this.category.category_id}?${params.toString()}`;

        this.updateCategoryUrl =
            `/platform-manager/categories/${this.category.category_id}/edit?${params.toString()}`;

        // IDP Category sidebar link
        document.getElementById("categoryLink").href =
            this.categoriesUrl;

        // Report sidebar link
        document.getElementById("reportLink").href =
            this.reportsUrl;

        // Close returns to View Category without saving
        document.getElementById("closeCategoryLink").href =
            this.viewCategoryUrl;

        // Cancel returns to View Category without saving
        document.getElementById("cancelButton").addEventListener(
            "click",
            () => {
                window.location.href = this.viewCategoryUrl;
            }
        );

        // Direct logout
        document.getElementById("logoutButton").addEventListener(
            "click",
            () => {
                window.location.href = "/";
            }
        );
    }

    // Set up form submission and input events
    setupForm() {

        this.form.addEventListener("submit", event => {

            event.preventDefault();

            this.updateCategory();
        });

        // Clear validation errors when editing
        this.categoryNameInput.addEventListener("input", () => {

            this.clearFieldError();
        });
    }

    // Validate Category Name
    validateForm() {

        const categoryName = this.categoryNameInput.value.trim();

        this.clearFieldError();

        if (!categoryName) {

            this.categoryNameInput.classList.add("invalid");

            this.categoryNameError.textContent =
                "Category Name is required.";

            this.categoryNameError.hidden = false;

            this.categoryNameInput.focus();

            return null;
        }

        return categoryName;
    }

    // Clear field validation errors
    clearFieldError() {

        this.categoryNameInput.classList.remove("invalid");
        this.categoryNameError.hidden = true;
        this.categoryNameError.textContent = "";
    }

    // Submit updated Category Name through the Boundary
    async updateCategory() {

        if (this.isSubmitting) {
            return;
        }

        const categoryName = this.validateForm();

        if (categoryName === null) {
            return;
        }

        this.isSubmitting = true;
        this.saveButton.disabled = true;
        this.message.hidden = true;

        try {

            // Prepare form data for the Flask Boundary
            const formData = new FormData();

            formData.append("category_name", categoryName);

            const response = await fetch(this.updateCategoryUrl, {
                method: "POST",
                body: formData
            });

            const contentType =
                response.headers.get("content-type") || "";

            if (!contentType.includes("application/json")) {
                throw new Error("Unexpected response from the server.");
            }

            const result = await response.json();

            // Handle failed updates or duplicate names
            if (!response.ok || !result.success) {

                this.showMessage(
                    result.message || "Unable to update category.",
                    false
                );

                return;
            }

            // Return to View Category after successful update
            window.location.href = this.viewCategoryUrl;

        } catch (error) {

            this.showMessage(
                error.message || "Unable to update category.",
                false
            );

        } finally {

            this.isSubmitting = false;
            this.saveButton.disabled = false;
        }
    }

    // Display success or error message
    showMessage(text, success) {

        this.message.hidden = false;
        this.message.textContent = text;

        this.message.className =
            "message " + (success ? "success" : "error");
    }
}

// Initialise Update Category page
new UpdateIDPCategoryPage();
</script>

</body>
</html>
