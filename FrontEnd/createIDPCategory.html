
<!--
What this code does?
- Display the Create IDP Category page.
- Collect Category Name and Category Description.
- Submit the form to the existing Create IDP Category Boundary.
- Display validation and duplicate-category errors returned by the Boundary.
- Redirect to IDP Category listing after successful creation.
- Preserve IDP Category and Report sidebar navigation.
- Preserve account_id and username through URL parameters.
- Log out directly without confirmation.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renovo | Create IDP Category</title>

<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#26344a;background:#f4f6fb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh}
button,input,textarea{font:inherit}
button{cursor:pointer}

/* Top Bar */
.topbar{height:76px;padding:0 36px;background:#14253e;color:white;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:24px;font-weight:850;letter-spacing:.07em}
.brand span{color:#8dded4}
.topbar-right,.user-info{display:flex;align-items:center;gap:16px}
.user-avatar{width:38px;height:38px;border-radius:50%;background:#2d5272;color:#8dded4;display:grid;place-items:center;font-size:13px;font-weight:750}
.user-details{display:flex;flex-direction:column;gap:3px}
.user-details strong{font-size:13px}
.user-details small{color:#d1deec;font-size:11px}
.logout-button{padding:10px 16px;border:1px solid #ffffff55;border-radius:8px;background:transparent;color:white;font-size:13px}
.logout-button:hover{background:#ffffff18}

/* Layout */
.dashboard-layout{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:calc(100vh - 76px)}
.sidebar{background:white;border-right:1px solid #e4e9f2;padding:32px 16px}
.sidebar-title{margin:0 14px 18px;color:#8290a3;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.sidebar-nav{display:flex;flex-direction:column;gap:8px}
.nav-link{display:block;padding:14px 16px;border-radius:9px;color:#52647a;font-size:14px;text-decoration:none}
.nav-link:hover{background:#f0f5f7}
.nav-link.active{background:#e6f3f3;color:#1c5062;font-weight:750}
.main-content{padding:42px 50px;min-width:0;width:100%;max-width:1100px}
.page-title{margin:0 0 28px;color:#14253e;font-size:30px}

/* Form */
.form-panel{background:white;border:1px solid #e4e9f2;border-radius:14px;padding:30px}
.form-title{margin:0 0 26px;font-size:19px;color:#14253e}
.form-group{margin-bottom:25px}
.form-label{display:block;margin-bottom:10px;color:#52647a;font-size:13px;font-weight:700}
.required{color:#c43b4a}
.form-input{width:100%;max-width:550px;padding:12px 14px;border:1px solid #dbe2ec;border-radius:8px;background:white;color:#26344a;font-size:13px;outline:none}
.form-input:focus{border-color:#28747f}
textarea.form-input{min-height:110px;resize:vertical}
.form-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:30px;padding-top:22px;border-top:1px solid #edf0f5}
.action-button{min-width:110px;padding:11px 20px;border:1px solid #dbe2ec;border-radius:8px;background:white;color:#52647a;font-size:13px;font-weight:700}
.action-button.primary{border-color:#1c5062;background:#1c5062;color:white}
.action-button.primary:hover{background:#256d7f}
.action-button:hover:not(.primary){background:#f4f6fb}
.action-button:disabled{opacity:.55;cursor:not-allowed}

/* Boundary Error Message */
.message{margin-bottom:20px;padding:13px 16px;border-radius:8px;font-size:13px}
.message.error{background:#fff0f0;color:#a22735}

@media(max-width:900px){
.dashboard-layout{grid-template-columns:200px minmax(0,1fr)}
.main-content{padding:32px 25px}
}
@media(max-width:650px){
.topbar{padding:16px 20px}
.user-details{display:none}
.dashboard-layout{display:block}
.sidebar{padding:12px;border-right:none;border-bottom:1px solid #e4e9f2}
.sidebar-title{display:none}
.sidebar-nav{flex-direction:row}
.main-content{padding:28px 18px}
.form-panel{padding:20px}
.form-actions{flex-wrap:wrap}
}
</style>
</head>

<body>
{% set display_username = username | default("Platform Manager", true) %}

<!-- Top Bar -->
<header class="topbar">
    <div class="brand">RENO<span>VO</span></div>

    <div class="topbar-right">
        <div class="user-info">
            <div class="user-avatar">PM</div>

            <div class="user-details">
                <strong>Hi, {{ display_username }}</strong>
                <small>Platform Manager</small>
            </div>
        </div>

        <button class="logout-button" id="logoutButton" type="button">
            Log out
        </button>
    </div>
</header>

<div class="dashboard-layout">

    <!-- Sidebar -->
    <aside class="sidebar">

        <p class="sidebar-title">Management</p>

        <nav class="sidebar-nav">

            <a class="nav-link active" id="categoryLink" href="#">
                IDP Category
            </a>

            <a class="nav-link" id="reportLink" href="#">
                Report
            </a>

        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">

        <h1 class="page-title">Create IDP Category</h1>

        <!-- Display errors returned by Flask Boundary -->
        {% if error %}
        <div class="message error" role="alert">
            {{ error }}
        </div>
        {% endif %}

        <!-- Create Category Form -->
        <section class="form-panel">

            <h2 class="form-title">Category Information</h2>

            <form id="createCategoryForm" method="POST">

                <!-- Category Name -->
                <div class="form-group">

                    <label class="form-label" for="categoryName">
                        Category Name <span class="required">*</span>
                    </label>

                    <input
                        class="form-input"
                        type="text"
                        id="categoryName"
                        name="category_name"
                        value="{{ form_data.category_name | default('', true) }}"
                        placeholder="Enter category name"
                        autocomplete="off"
                        required
                    >

                </div>

                <!-- Category Description -->
                <div class="form-group">

                    <label class="form-label" for="categoryDescription">
                        Category Description <span class="required">*</span>
                    </label>

                    <textarea
                        class="form-input"
                        id="categoryDescription"
                        name="category_description"
                        placeholder="Enter category description"
                        required
                    >{{ form_data.category_description | default('', true) }}</textarea>

                </div>

                <!-- Form Actions -->
                <div class="form-actions">

                    <button class="action-button" id="cancelButton" type="button">
                        Cancel
                    </button>

                    <button class="action-button primary" id="createButton" type="submit">
                        Create Category
                    </button>

                </div>

            </form>
        </section>

    </main>
</div>

<script>
class CreateIDPCategoryPage {

    constructor() {

        // Navigation details provided by the Boundary
        this.accountId = {{ account_id | default("", true) | tojson }};
        this.username = {{ display_username | tojson }};

        this.setupNavigation();
        this.setupForm();
    }

    // Set up sidebar navigation, Cancel and Logout
    setupNavigation() {

        const params = new URLSearchParams({
            account_id: String(this.accountId),
            username: this.username
        });

        this.categoriesUrl =
            "/platform-manager/categories?" + params.toString();

        this.reportsUrl =
            "/platform-manager/reports?" + params.toString();

        const createUrl =
            "/platform-manager/categories/create?" + params.toString();

        // Preserve navigation parameters during form submission
        document.getElementById("createCategoryForm").action =
            createUrl;

        document.getElementById("categoryLink").href =
            this.categoriesUrl;

        document.getElementById("reportLink").href =
            this.reportsUrl;

        document.getElementById("cancelButton").addEventListener(
            "click",
            () => {
                window.location.href = this.categoriesUrl;
            }
        );

        document.getElementById("logoutButton").addEventListener(
            "click",
            () => {
                window.location.href = "/";
            }
        );
    }

    // Submit the form normally to the Flask Boundary
    setupForm() {

        const form = document.getElementById("createCategoryForm");
        const createButton = document.getElementById("createButton");

        form.addEventListener("submit", () => {

            // Browser handles required fields.
            // Boundary performs final validation and database orchestration.
            createButton.disabled = true;
        });
    }
}

new CreateIDPCategoryPage();
</script>

</body>
</html>
