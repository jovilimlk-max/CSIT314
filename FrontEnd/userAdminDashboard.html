
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renovo | User Admin Dashboard</title>
    <!-- Design only: existing HTML, scripts and BCE connections are unchanged. -->
    <style>
        /* Page colours and layout */
        :root {
            font-family: Arial, sans-serif;
            color: #26344a;
            background: #f4f6fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            width: calc(100% - 40px);
            max-width: 1060px;
            margin: 40px auto;
            padding: 36px;
            background: white;
            border: 1px solid #e0e7ef;
            border-radius: 12px;
            box-shadow: 0 12px 36px #182e470c;
            line-height: 1.6;
        }

        body::before {
            content: "RENOVO";
            display: block;
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e0e7ef;
            color: #1c5062;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 30px;
            line-height: 1.3;
        }

        h2 {
            margin: 24px 0 14px;
            font-size: 20px;
        }

        p {
            margin: 12px 0 20px;
            color: #65748a;
        }

        strong {
            color: #26344a;
        }

        /* Existing buttons and keyboard focus */
        button {
            display: inline-block;
            width: auto;
            height: auto;
            margin: 4px 8px 4px 0;
            padding: 11px 18px;
            border: 1px solid #1c5062;
            border-radius: 6px;
            background: #1c5062;
            color: white;
            font: inherit;
            font-size: 13px;
            font-weight: bold;
            line-height: 1.4;
            text-align: center;
            vertical-align: middle;
            cursor: pointer;
        }

        button:hover {
            background: #256d7f;
        }

        button:disabled {
            border-color: #d4dce5;
            background: #edf1f5;
            color: #7c8797;
            cursor: not-allowed;
        }

        button:focus-visible, input:focus-visible,
        select:focus-visible, textarea:focus-visible {
            outline: 3px solid #8fc8ce;
            outline-offset: 3px;
        }

        #backButton, #cancelButton, form button[type="button"] {
            border-color: #cdd7e4;
            background: white;
            color: #40556d;
        }

        #backButton:hover, #cancelButton:hover,
        form button[type="button"]:hover {
            background: #f0f4f8;
        }

        /* Existing form fields */
        form {
            max-width: 680px;
            margin-top: 26px;
            padding: 26px;
            border: 1px solid #e0e7ef;
            border-radius: 8px;
            background: #fafbfd;
        }

        form label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: bold;
        }

        form input, form select, form textarea {
            display: block;
            width: 100%;
            margin-bottom: 22px;
            padding: 11px 13px;
            border: 1px solid #cbd6e3;
            border-radius: 6px;
            background: white;
            color: #26344a;
            font: inherit;
            font-size: 14px;
            line-height: 1.5;
        }

        form textarea {
            min-height: 135px;
            resize: vertical;
        }

        form br {
            display: none;
        }

        /* Existing profile table */
        table {
            display: table;
            width: 100%;
            margin: 12px 0 20px;
            overflow-x: auto;
            border: 1px solid #e0e7ef;
            border-radius: 8px;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        th, td {
            padding: 16px 20px;
            border: 0;
            border-bottom: 1px solid #e0e7ef;
        }

        th {
            background: #edf3f7;
            color: #53667c;
            font-size: 12px;
        }

        td {
            vertical-align: top;
        }

        tbody tr:last-child td {
            border-bottom: 0;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        td button {
            padding: 7px 13px;
        }

        /* Messages still controlled by the original scripts */
        #message:not(:empty), #successMessage {
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 13px;
        }

        #message:not(:empty) {
            border: 1px solid #f0cbd0;
            background: #fff1f2;
            color: #9b2f3c;
        }

        #successMessage {
            border: 1px solid #c7e4d7;
            background: #eaf7f0;
            color: #23684c;
        }

        [hidden] {
            display: none !important;
        }

        /* Compact layout on smaller screens */
        @media (max-width: 600px) {
            body {
                width: calc(100% - 24px);
                margin: 12px auto;
                padding: 22px;
            }

            h1 {
                font-size: 25px;
            }

            form {
                padding: 18px;
            }

            th, td {
                padding: 12px;
            }

            table {
                display: block;
            }
        }

        /* Dashboard navigation keeps its original routes. */
        body > button {
            display: block;
            width: 100%;
            max-width: 680px;
            margin-top: 12px;
            padding: 22px 24px;
            text-align: left;
            font-size: 15px;
        }

        body > button:last-of-type {
            width: auto;
            padding: 11px 18px;
            border-color: #cdd7e4;
            background: white;
            color: #40556d;
        }

        body > br {
            display: none;
        }
    </style>
</head>
<body>

    <h1>User Admin Dashboard</h1>

    <p>Login successful! Welcome to Renovo.</p>

    <p>This dashboard is currently under development.</p>

    <!-- Navigate to the User Accounts management section -->
    <button onclick="window.location.href='/user-admin/accounts'">
        User Accounts
    </button>

    <br><br>

    <!-- Navigate to the User Profiles management section -->
    <button onclick="window.location.href='/user-admin/profiles'">
        User Profiles
    </button>

    <br><br>

    <!-- Return to the login page -->
    <button onclick="window.location.href='/'">
        Log out
    </button>

</body>
</html>
