ign-items:center;gap:6px;border-radius:20px;padding:4px 10px;background:#eaf3e9;color:#356b40;white-space:nowrap}.badge:before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}.badge.suspended{background:#faeee7;color:#9b5d36}.sort{border:0;background:none;padding:0;color:inherit;text-transform:inherit;letter-spacing:inherit;font-size:inherit}.view{padding:6px 12px;font-size:12px}.pagination{padding:17px 23px;display:flex;justify-content:space-between;gap:15px;align-items:center;color:var(--muted);font-size:12px}.pages{display:flex;gap:5px}.pages button{padding:5px 10px;font-size:12px}.pages button[aria-current]{background:var(--light);border-color:var(--green);color:var(--green)}.banner{padding:13px 17px;display:flex;justify-content:space-between;align-items:center;gap:15px;background:#edf6ed;border:1px solid #cedfcb;border-radius:6px;color:#315c3c;margin-bottom:22px}.banner button{border:0;background:none;padding:0 5px;font-size:22px}.empty{text-align:center;padding:48px}.empty p{color:var(--muted)}.form-panel{max-width:750px}.fields{padding:28px;display:grid;gap:22px}.field label{display:block;font-size:12px;font-weight:600;margin-bottom:7px}.required{color:var(--red)}.hint{font-size:12px;color:var(--muted);margin:6px 0 0}.error{font-size:12px;color:var(--red);margin-top:5px}.field [aria-invalid=true]{border-color:var(--red);background:#fffafa}.actions{display:flex;justify-content:flex-end;gap:10px;padding:20px 28px;background:#fafbf8;border-top:1px solid var(--border)}.back{display:inline-block;margin-bottom:20px}.details{max-width:750px}.details-grid{display:grid;grid-template-columns:1fr 1fr;gap:25px;padding:28px}.detail-label{color:var(--muted);font-size:12px;margin-bottom:7px}.detail-value{font-weight:600;overflow-wrap:anywhere}.profile-box{grid-column:1/-1;padding:20px;background:#f7f9f4;border:1px solid var(--border);border-radius:6px}.profile-box p{margin:4px 0 0;color:var(--muted);font-size:12px}.detail-foot{padding:0 28px 23px;f <header><div class="brand">renovo<span>.</span></div><div class="header-right"><div class="identity"><div class="avatar">UA</div><div>Hi, User Admin<small>User Administrator</small></div></div><button id="logout">Log out ↗</button></div></header>
<div class="shell" id="shell"><aside aria-label="Main navigation"><div class="eyebrow">Administration</div><button class="nav" data-nav="dashboard"></button><button class="nav" data-nav="accounts"></button><button class="nav" data-nav="profiles"></button><div class="sidebar-note">RENOVO ADMIN<br>People, profiles & possibilities.</div></aside><main id="main"></main></div>
<dialog id="modal" aria-labelledby="modal-title"></dialog>
<script>
'use strict';
/* Standalone front-end implementation of US11–US15. Replace the local data
   functions with authenticated API calls for production. Password input is
   validated for the UI only; passwords are never retained or persisted. */
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icons={dashboard:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',accounts:'<circle cx="9" cy="7" r="4"/><path d="M2 21v-3a7 7 0 0 1 14 0v3m1-17a4 4 0 0 1 0 8m3 9v-3a7 7 0 0 0-3-6"/>',profiles:'<rect x="4" y="3" width="16" height="19" rx="2"/><circle cx="12" cy="9" r="3"/><path d="M8 18h8"/>'};
const svg=(path)=>`<svg aria-hidden="true" viewBox="0 0 24 24">${path}</svg>`;
const roles=['Customer','Interior Designer','User Admin','Platform Manager'];
const profiles=[{name:'Standard Customer',role:'Customer',description:'Customer account profile. (Sample profile)'},{name:'Senior ID',role:'Interior Designer',description:'Manages company info and a portfolio of design projects.'},{name:'Assistant Senior ID',role:'Interior Designer',description:'Supports company information and design project management.'},{name:'User Administrator',role:'User Admin',description:'Manages user accounts and their assigned profiles. (Sample profile)'},{name:'Platform Manager',role:'Platform Manager',description:'Oversees platform operations. (Sample profile)'}];
const seed=[['Tan Wei Ming','tanweiming@gmail.com',1,'Senior ID'],['Priya Nair','priya.nair@gmail.com',1,'Assistant Senior ID'],['Lee Mei','lee.mei@gmail.com',0,'Standard Customer'],['Raj Kumar','raj.kumar@gmail.com',3,'Platform Manager'],['Daniel Lim','daniel.lim@gmail.com',0,'Standard Customer'],['Nurul Huda','nurul.huda@gmail.com',0,''],['Sarah Thomas','sarah.thomas@renovo.example',2,'User Administrator'],['Chloe Tan','chloe.tan@example.com',0,''],['Amir Rahman','amir.rahman@example.com',1,'Senior ID'],['Siti Aisyah','siti.aisyah@example.com',0,'Standard Customer'],['James Wong','james.wong@example.com',1,'Assistant Senior ID'],['Rachel Goh','rachel.goh@example.com',3,'Platform Manager']].map((x,i)=>({id:`A${String(i+1).padStart(3,'0')}`,name:x[0],email:x[1],role:roles[x[2]],profile:x[3],status:[4,9].includes(i)?'Suspended':'Active',updated:'2026-10-18T06:40:00.000Z'}));
const STORE='renovo-admin-wireframe-v2';let accounts=structuredClone(seed),storageWarning='';
try{const saved=JSON.parse(localStorage.getItem(STORE));if(Array.isArray(saved)&&saved.every(a=>a&&typeof a.id==='string'&&typeof a.name==='string'&&typeof a.email==='string'&&roles.includes(a.role)&&['Active','Suspended'].includes(a.status)&&(!a.profile||profiles.some(p=>p.name===a.profile&&p.role===a.role))&&!Number.isNaN(Date.parse(a.updated)))&&new Set(saved.map(a=>a.id)).size===saved.length)accounts=saved;}catch(e){storageWarning='Browser storage is unavailable. Changes will last for this session only.';}
let screen='dashboard',selected=null,query='',statusFilter='',sortDirection=0,page=1,banner='',formInitial='',pendingAction=null,loggedOut=false;
const badge=a=>`<span class="badge ${a.status==='Suspended'?'suspended':''}">${esc(a.status)}</span>`;
const date=s=>new Date(s).toLocaleString('en-SG',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Singapore'});
function save(){try{localStorage.setItem(STORE,JSON.stringify(accounts));}catch(e){storageWarning='Changes could not be saved in this browser. They will last for this session only.';}}
function current(){return accounts.find(a=>a.id===selected)}
function announce(message){banner=message;}
function heading(title,subtitle,action=''){return `<div class="page-head"><div><div class="eyebrow">User administration</div><h1 tabindex="-1">${title}</h1><p>${subtitle}</p></div>${action}</div>`;}
function go(next,id){if(id)selected=id;screen=next;render();window.scrollTo(0,0);$('h1')?.focus({preventScroll:true});}
function guarded(next,id){if(['create','edit'].includes(screen)&&formDirty()){openModal('Discard changes?','You have unsaved changes. Discard them and leave this page?','Discard',()=>go(next,id),'Keep editing',true);}else go(next,id);}
function render(){
 document.querySelectorAll('[data-nav]').forEach(b=>{let n=b.dataset.nav;b.innerHTML=svg(icons[n])+({dashboard:'Dashboard',accounts:'User Accounts',profiles:'User Profiles'}[n]);b.classList.toggle('active',n===screen||(n==='accounts'&&['create','view','edit'].includes(screen)));if(b.classList.contains('active'))b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
 const body={dashboard:dashboardHTML,accounts:accountsHTML,create:formHTML,view:viewHTML,edit:formHTML,profiles:profilesHTML}[screen]();
 $('#main').innerHTML=`<div class="crumb">Administration &nbsp;/&nbsp; ${screen==='dashboard'?'Overview':screen==='profiles'?'User Profiles':'User Accounts'}</div>${banner?`<div class="banner" role="status"><span>✓ &nbsp;${esc(banner)}</span><button data-action="dismiss" aria-label="Close success banner">×</button></div>`:''}${body}<div class="prototype">Front-end demo · Sample account data · Details save in this browser · Passwords are not stored.${storageWarning?`<br>${esc(storageWarning)}`:''}</div><footer><span>© ${new Date().getFullYear()} Renovo. User administration.</span><span>All dates shown in Singapore time.</span></footer>`;
 if(screen==='accounts')bindList();if(['edit','create'].includes(screen))bindForm();
}
function dashboardHTML(){return heading('Welcome, User Admin.','A clear view of your users and their access.')+`<div class="stats"><button class="panel stat" data-action="all"><span class="muted">Total accounts</span><strong>${accounts.length}</strong><small>View all accounts →</small></button><button class="panel stat" data-action="profiles"><span class="muted">User profiles</span><strong>${profiles.length}</strong><small>Browse profiles →</small></button><button class="panel stat" data-action="suspended"><span class="muted">Suspended accounts</span><strong>${accounts.filter(a=>a.status==='Suspended').length}</strong><small>Review accounts →</small></button></div><div class="section-head"><div><h2>User account management</h2><span class="muted">Create accounts, manage details and control access.</span></div><button class="primary" data-action="create">+ Create account</button></div><div class="panel panel-pad"><h3>Manage your community</h3><p class="muted">Find a user, update their role or assign a profile. Suspend or reactivate access with a confirmation.</p><button data-action="all">Open User Accounts →</button></div>`;}
function filtered(){let q=query.toLowerCase();let list=accounts.filter(a=>(a.name.toLowerCase().includes(q)||a.email.toLowerCase().includes(q))&&(!statusFilter||a.status===statusFilter));if(sortDirection)list.sort((a,b)=>sortDirection*a.name.localeCompare(b.name));return list;}
function accountsHTML(){const list=filtered(),count=Math.max(1,Math.ceil(list.length/5));page=Math.min(page,count);const rows=list.slice((page-1)*5,page*5);return heading('User Accounts','Find and manage the people on Renovo.','<button class="primary" data-action="create">+ Create account</button>')+`<div class="panel"><form class="tools" id="search-form" role="search"><div class="search">${svg('<circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/>')}<label for="search" class="sr">Search name or email</label><input id="search" type="search" placeholder="Search name or email" value="${esc(query)}"></div><button type="submit">Search</button><label class="sr" for="status">Filter by status</label><select id="status"><option value="">All status</option>${['Active','Suspended'].map(s=>`<option ${s===statusFilter?'selected':''}>${s}</option>`).join('')}</select>${query?'<button class="link" type="button" data-action="clear">Clear search</button>':''}</form><div class="table-wrap"><table><caption class="sr">User accounts, five per page</caption><thead><tr><th scope="col">Account ID</th><th scope="col" aria-sort="${sortDirection===1?'ascending':sortDirection===-1?'descending':'none'}"><button class="sort" data-action="sort">Name ${sortDirection===1?'↑':sortDirection===-1?'↓':'↕'}</button></th><th scope="col">Role</th><th scope="col">Status</th><th scope="col"><span class="sr">Actions</span></th></tr></thead><tbody>${rows.map(a=>`<tr><td class="muted">${esc(a.id)}</td><td><div class="person">${esc(a.name)}</div><small>${esc(a.email)}</small></td><td>${esc(a.role)}</td><td>${badge(a)}</td><td><button class="view" data-view="${esc(a.id)}" aria-label="View ${esc(a.name)}">View</button></td></tr>`).join('')}</tbody></table></div>${!list.length?'<div class="empty"><h2>No accounts match</h2><p>Try another name, email address or status.</p><button class="link" data-action="clear">Clear search</button> &nbsp; <button class="link" data-action="reset-filters">Reset all filters</button></div>':''}<div class="pagination"><span>Showing ${list.length?(page-1)*5+1:0}–${Math.min(page*5,list.length)} of ${list.length} accounts</span><nav class="pages" aria-label="Account pagination"><button data-page="${page-1}" ${page===1?'disabled':''} aria-label="Previous page">‹</button>${Array.from({length:count},(_,i)=>`<button data-page="${i+1}" ${page===i+1?'aria-current="page"':''}>${i+1}</button>`).join('')}<button data-page="${page+1}" ${page===count?'disabled':''} aria-label="Next page">›</button></nav></div></div>`;}
function bindList(){$('#search-form').onsubmit=e=>{e.preventDefault();query=$('#search').value.trim();page=1;render();};$('#status').onchange=e=>{query=$('#search').value.trim();statusFilter=e.target.value;page=1;render();};}
function formHTML(){const edit=screen==='edit',a=edit?current():{name:'',email:'',role:'',profile:''};return `<button class="link back" data-action="back">← Back to ${edit?'account':'User Accounts'}</button>`+heading(edit?'Edit user account':'Create user account',edit?'Keep account details and profile assignments up to date.':'Set up a new account. A user profile can be assigned later.')+`<form id="account-form" class="panel form-panel" novalidate><div class="fields"><div class="field"><label for="name">Name <span class="required">*</span></label><input id="name" name="name" maxlength="100" autocomplete="name" value="${esc(a.name)}" aria-describedby="name-error"><div id="name-error" class="error"></div></div><div class="field"><label for="email">Email <span class="required">*</span></label><input id="email" name="email" type="email" maxlength="254" autocomplete="email" value="${esc(a.email)}" aria-describedby="email-error"><div id="email-error" class="error"></div></div><div class="field"><label for="password">${edit?'New password':'Password'} ${edit?'(optional)':'<span class="required">*</span>'}</label><input id="password" name="password" type="password" autocomplete="new-password" aria-describedby="password-error password-hint"><p class="hint" id="password-hint">${edit?'Leave blank to keep the existing password. ':''}Use at least 8 characters. Demo only: this field is validated but never saved.</p><div id="password-error" class="error"></div></div><div class="field"><label for="role">Role <span class="required">*</span></label><select id="role" name="role" aria-describedby="role-error"><option value="">Select a role</option>${roles.map(r=>`<option ${r===a.role?'selected':''}>${r}</option>`).join('')}</select><div id="role-error" class="error"></div></div>${edit?`<div class="field"><label for="profile">User profile</label><select id="profile" name="profile" aria-describedby="profile-hint"></select><p id="profile-hint" class="hint" aria-live="polite">Only profiles for the selected role are listed.</p></div>`:''}</div><div class="actions"><button type="button" data-action="cancel-form">Cancel</button><button class="primary" type="submit">${edit?'Save changes':'Create account'}</button></div></form>`;}
function formSnapshot(){return JSON.stringify([...new FormData($('#account-form')).entries()]);}
function formDirty(){return !!$('#account-form')&&formSnapshot()!==formInitial;}
function setProfiles(role,value=''){const list=profiles.filter(p=>p.role===role);$('#profile').innerHTML='<option value="">No user profile</option>'+list.map(p=>`<option ${p.name===value?'selected':''}>${esc(p.name)}</option>`).join('');}
function bindForm(){if(screen==='edit'){setProfiles(current().role,current().profile);$('#role').onchange=()=>{setProfiles($('#role').value);$('#profile-hint').textContent='Role changed. Select a matching profile or leave it unassigned.';};}formInitial=formSnapshot();$('#account-form').onsubmit=e=>{e.preventDefault();const edit=screen==='edit',d=Object.fromEntries(new FormData(e.target)),errors={};d.name=d.name.trim();d.email=d.email.trim();if(!d.name)errors.name='Please enter a name.';if(!d.email)errors.email='Please enter an email address.';else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email))errors.email='Please enter a valid email address.';else if(accounts.some(a=>a.email.toLowerCase()===d.email.toLowerCase()&&(!edit||a.id!==selected)))errors.email='An account with this email already exists.';if(!edit&&!d.password)errors.password='Please enter a password.';else if(d.password&&d.password.length<8)errors.password='Use at least 8 characters.';if(!d.role)errors.role='Please select a role.';for(const key of ['name','email','password','role']){$('#'+key+'-error').textContent=errors[key]||'';$('#'+key).setAttribute('aria-invalid',!!errors[key]);}if(Object.keys(errors).length){$('#'+Object.keys(errors)[0]).focus();return;}
 if(edit){Object.assign(current(),{name:d.name,email:d.email,role:d.role,profile:profiles.some(p=>p.name===d.profile&&p.role===d.role)?d.profile:'',updated:new Date().toISOString()});save();announce('Account details updated successfully.');go('view');}else{const next=Math.max(0,...accounts.map(a=>Number(a.id.slice(1))||0))+1;accounts.unshift({id:'A'+String(next).padStart(3,'0'),name:d.name,email:d.email,role:d.role,profile:'',status:'Active',updated:new Date().toISOString()});save();query='';statusFilter='';page=1;sortDirection=0;announce(`Account for “${d.name}” created successfully.`);go('accounts');}};}
function viewHTML(){const a=current(),p=profiles.find(p=>p.name===a.profile&&p.role===a.role);return `<button class="link back" data-action="all">← Back to User Accounts</button>`+heading(esc(a.name),`Account ${esc(a.id)}`,badge(a))+`<div class="panel details"><div class="details-grid"><div><div class="detail-label">Name</div><div class="detail-value">${esc(a.name)}</div></div><div><div class="detail-label">Email</div><div class="detail-value">${esc(a.email)}</div></div><div><div class="detail-label">Password</div><div class="detail-value" aria-label="Password hidden">••••••••</div></div><div><div class="detail-label">Role</div><div class="detail-value">${esc(a.role)}</div></div><div class="profile-box"><div class="detail-label">User profile</div><strong>${p?esc(p.name):'No user profile assigned yet'}</strong><p>${p?esc(p.description):'Edit this account to assign a profile for its role.'}</p></div></div><div class="detail-foot">Last updated: ${date(a.updated)}</div><div class="actions"><button class="${a.status==='Active'?'danger':''}" data-action="toggle-status">${a.status==='Active'?'Suspend':'Reactivate'}</button><button class="primary" data-action="edit">Edit</button></div></div><div class="access-panel"><h3>Account access preview</h3><p>Preview the login response for this account. This checks the demo account status; real authentication must be connected to your backend.</p><button data-action="test-access">Test login access</button><div id="access-result" class="access-result" role="status"></div></div>`;}
function profilesHTML(){return heading('User Profiles','Profile choices available when editing an account.')+`<p class="muted">Senior ID and Assistant Senior ID follow the wireframe. Other role profiles are sample options. Profile creation and editing are outside this wireframe.</p><div class="profile-list">${profiles.map(p=>`<article class="panel profile-card"><div class="eyebrow">${esc(p.role)}</div><h2>${esc(p.name)}</h2><p>${esc(p.description)}</p><p>${accounts.filter(a=>a.profile===p.name&&a.role===p.role).length} assigned accounts</p></article>`).join('')}</div>`;}
let modalTrigger=null;
function openModal(title,message,confirmText,action,cancelText='Cancel',danger=false){modalTrigger=document.activeElement;pendingAction=action;$('#modal').innerHTML=`<button class="close" data-modal="cancel" aria-label="Close dialog">×</button><h2 id="modal-title">${esc(title)}</h2><p>${esc(message)}</p><div class="modal-actions"><button data-modal="cancel" autofocus>${esc(cancelText)}</button><button class="${danger?'danger solid':'primary'}" data-modal="confirm">${esc(confirmText)}</button></div>`;$('#modal').showModal();}
function closeModal(){$('#modal').close();pendingAction=null;if(modalTrigger?.isConnected)modalTrigger.focus();}
$('#modal').addEventListener('cancel',e=>{e.preventDefault();closeModal();});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.modal==='cancel'){closeModal();return;}if(b.dataset.modal==='confirm'){const action=pendingAction;closeModal();action?.();return;}if(b.dataset.nav){guarded(b.dataset.nav);return;}if(b.dataset.view){go('view',b.dataset.view);return;}if(b.dataset.page){page=Number(b.dataset.page);render();return;}
 switch(b.dataset.action){case'dismiss':banner='';b.closest('.banner').remove();break;case'all':guarded('accounts');break;case'profiles':guarded('profiles');break;case'suspended':query='';statusFilter='Suspended';page=1;go('accounts');break;case'create':go('create');break;case'edit':go('edit');break;case'back':guarded(screen==='edit'?'view':'accounts');break;case'cancel-form':go(screen==='edit'?'view':'accounts');break;case'clear':query='';page=1;render();break;case'reset-filters':query='';statusFilter='';page=1;render();break;case'sort':sortDirection=sortDirection===1?-1:1;page=1;render();break;
 case'toggle-status':{const a=current(),suspend=a.status==='Active';openModal(suspend?'Suspend this account?':'Reactivate this account?',suspend?`${a.name} will not be able to log in until this account is reactivated.`:`${a.name} will be able to log in again.`,suspend?'Suspend':'Reactivate',()=>{a.status=suspend?'Suspended':'Active';a.updated=new Date().toISOString();save();announce(`Account ${suspend?'suspended':'reactivated'} successfully.`);render();},'Cancel',suspend);break;}
 case'test-access':{const blocked=current().status==='Suspended';$('#access-result').classList.toggle('blocked',blocked);$('#access-result').textContent=blocked?'Your account has been suspended. Please contact the administrator.':'Account is active. Login would proceed to credential verification.';break;}
 case'return':loggedOut=false;$('#shell').hidden=false;$('#logout').hidden=false;$('#signedout').remove();go('dashboard');break;
 }
});
$('#logout').onclick=()=>{const dirty=['create','edit'].includes(screen)&&formDirty();openModal('Log out?',dirty?'Your unsaved changes will be discarded. Log out of this demo dashboard?':'End this demo dashboard session?', 'Log out',()=>{loggedOut=true;$('#shell').hidden=true;$('#logout').hidden=true;const section=document.createElement('section');section.id='signedout';section.className='panel signedout';section.innerHTML='<div class="brand">renovo<span>.</span></div><h1>You’re logged out.</h1><p class="muted">You have left the demo dashboard. Account changes remain saved in this browser.</p><button class="primary" data-action="return">Return to demo dashboard</button>';document.body.append(section);section.querySelector('button').focus();});};
window.addEventListener('beforeunload',e=>{if(!loggedOut&&['create','edit'].includes(screen)&&formDirty()){e.preventDefault();e.returnValue='';}});
render();
</script>
</body>
</html>
