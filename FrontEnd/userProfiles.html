
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Profiles</title>
</head>
<body>

    <h1>User Profiles</h1>

    <!-- Display a success message after creating a profile -->
    <p id="successMessage" hidden>
        User profile created successfully.
    </p>

    <p>Manage user profiles in Renovo.</p>

    <!-- Navigate to the Create User Profile page -->
    <button onclick="window.location.href='/user-admin/profiles/create'">
        Create User Profile
    </button>

    <br><br>

    <!-- Display existing user profiles retrieved from the database -->
    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>Profile Name</th>
                <th>Description</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>
            {% for profile in profiles %}
            <tr>
                <td>{{ profile.profile_name }}</td>
                <td>{{ profile.description }}</td>
                <td>{{ profile.status }}</td>
                <td>
                    <button onclick="window.location.href='/user-admin/profiles/{{ profile.id }}'">
                        View
                    </button>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <br>

    <!-- Return to the User Admin Dashboard -->
    <button onclick="window.location.href='/user-admin/dashboard'">
        Back to Dashboard
    </button>

    <script>
        // Check whether a profile was just created successfully
        const params = new URLSearchParams(window.location.search);

        if (params.get("created") === "1") {
            document.getElementById("successMessage").hidden = false;

            // Remove the success indicator from the URL
            window.history.replaceState(
                {},
                "",
                window.location.pathname
            );
        }
    </script>

</body>
</html>
