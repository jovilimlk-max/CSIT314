
<!--
What this code does?
- Display the Platform Manager IDP Category management page.
- Show all IDP categories retrieved through the Flask Boundary.
- Allow searching for categories by Category ID or Category Name.
- Filter categories by active, suspended or all statuses.
- Sort categories by Category ID in ascending or descending order.
- Display five categories per page using JavaScript pagination.
- Provide a Create Category button and View links.
- Connect the Report sidebar link to the Report landing page.
- Preserve account_id and username when navigating.
- Log out directly without confirmation.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renovo | IDP Categories</title>

<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#26344a;background:#f4f6fb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer}

/* Top Bar */
.topbar{height:76px;padding:0 36px;background:#14253e;color:white;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:24px;font-weight:850;letter-spacing:.07em}
.brand span{color:#8dded4}
.topbar-right,.user-info{display:flex;align-items:center;gap:16px}
.user-avatar{width:38px;height:38px;border-radius:50%;background:#2d5272;color:#8dded4;display:grid;place-items:center;font-size:13px;font-weight:750}
.user-details{display:flex;flex-direction:column;gap:3px}
.user-details strong{font-size:13px}
.user-details small{color:#d1deec;font-size:11px}
.logout-button{padding:10px 16px;border:1px solid #ffffff55;border-radius:8px;background:transparent;color:white;font-size:13px}
.logout-button:hover{background:#ffffff18}

/* Dashboard Layout */
.dashboard-layout{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:calc(100vh - 76px)}
.sidebar{background:white;border-right:1px solid #e4e9f2;padding:32px 16px}
.sidebar-title{margin:0 14px 18px;color:#8290a3;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.sidebar-nav{display:flex;flex-direction:column;gap:8px}
.nav-link{display:block;padding:14px 16px;border-radius:9px;color:#52647a;font-size:14px;text-decoration:none}
.nav-link:hover{background:#f0f5f7}
.nav-link.active{background:#e6f3f3;color:#1c5062;font-weight:750}
.main-content{padding:42px 50px;min-width:0;width:100%;max-width:1300px}

/* Page Header */
.page-header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}
.page-title{margin:0;color:#14253e;font-size:30px}
.create-button{display:inline-flex;align-items:center;justify-content:center;padding:12px 20px;border:none;border-radius:8px;background:#1c5062;color:white;font-size:13px;font-weight:700;text-decoration:none}
.create-button:hover{background:#256d7f}

/* Category Panel */
.category-panel{background:white;border:1px solid #e4e9f2;border-radius:14px;overflow:hidden}
.panel-header{padding:25px 26px 20px}
.section-title{margin:0 0 22px;font-size:19px;color:#14253e}
.filter-bar{display:flex;align-items:end;gap:14px;flex-wrap:wrap}
.filter-group{display:flex;flex-direction:column;gap:8px}
.filter-group.search-group{flex:1;min-width:220px}
.filter-label{font-size:12px;font-weight:700;color:#52647a}
.filter-input,.filter-select{height:42px;padding:0 13px;border:1px solid #dbe2ec;border-radius:8px;background:white;color:#26344a;font-size:13px;outline:none}
.filter-input:focus,.filter-select:focus{border-color:#28747f}
.filter-select{min-width:145px}
.search-button{height:42px;padding:0 22px;border:none;border-radius:8px;background:#1c5062;color:white;font-size:13px;font-weight:700}
.search-button:hover{background:#256d7f}

/* Table */
.table-wrapper{overflow-x:auto}
.category-table{width:100%;border-collapse:collapse;text-align:left}
.category-table th{padding:17px 20px;background:#f7f9fc;color:#52647a;font-size:12px;font-weight:750;border-top:1px solid #e4e9f2;border-bottom:1px solid #e4e9f2}
.category-table td{padding:18px 20px;border-bottom:1px solid #edf0f5;font-size:13px}
.category-table tbody tr:last-child td{border-bottom:none}
.category-table tbody tr:hover{background:#fafcfe}
.status-badge{display:inline-block;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:750;text-transform:capitalize}
.status-badge.active{background:#e6f6f0;color:#186b4d}
.status-badge.suspended{background:#fff1ed;color:#b45335}
.view-link{color:#28747f;text-decoration:none;font-size:13px;font-weight:700}
.view-link:hover{text-decoration:underline}

/* Empty State */
.empty-state{padding:50px 20px;text-align:center;color:#738096;font-size:13px}

/* Pagination */
.pagination{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 22px;border-top:1px solid #e4e9f2}
.pagination-info{font-size:12px;color:#738096}
.pagination-controls{display:flex;align-items:center;gap:12px}
.pagination-button{padding:8px 14px;border:1px solid #cdd7e4;border-radius:7px;background:white;color:#52647a;font-size:12px}
.pagination-button:hover:not(:disabled){background:#f0f5f7}
.pagination-button:disabled{opacity:.45;cursor:not-allowed}
.page-number{font-size:12px;color:#52647a}
[hidden]{display:none!important}

/* Responsive */
@media(max-width:900px){
.dashboard-layout{grid-template-columns:200px minmax(0,1fr)}
.main-content{padding:32px 25px}
}
@media(max-width:650px){
.topbar{padding:16px 20px}
.user-details{display:none}
.dashboard-layout{display:block}
.sidebar{padding:12px;border-right:none;border-bottom:1px solid #e4e9f2}
.sidebar-title{display:none}
.sidebar-nav{flex-direction:row}
.main-content{padding:28px 18px}
.page-header{align-items:flex-start;flex-direction:column}
.filter-bar{align-items:stretch;flex-direction:column}
.filter-group.search-group{min-width:0}
.filter-select{width:100%}
.pagination{flex-direction:column;align-items:stretch}
}
</style>
</head>

<body>
{% set display_username = username | default("Platform Manager", true) %}

<!-- Top Bar -->
<header class="topbar">
    <div class="brand">RENO<span>VO</span></div>

    <div class="topbar-right">

        <div class="user-info">
            <div class="user-avatar">PM</div>

            <div class="user-details">
                <strong>Hi, {{ display_username }}</strong>
                <small>Platform Manager</small>
            </div>
        </div>

        <button class="logout-button" id="logoutButton" type="button">
            Log out
        </button>

    </div>
</header>

<div class="dashboard-layout">

    <!-- Sidebar -->
    <aside class="sidebar">

        <p class="sidebar-title">Management</p>

        <nav class="sidebar-nav">

            <a class="nav-link active" id="categoryLink" href="#">
                IDP Category
            </a>

            <a class="nav-link" id="reportLink" href="#">
                Report
            </a>

        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">

        <!-- Page Heading -->
        <div class="page-header">

            <h1 class="page-title">IDP Category</h1>

            <a class="create-button" id="createCategoryLink" href="#">
                + Create Category
            </a>

        </div>

        <!-- Category List -->
        <section class="category-panel">

            <div class="panel-header">

                <h2 class="section-title">IDP Categories</h2>

                <!-- Search, Status Filter and Sorting -->
                <div class="filter-bar">

                    <div class="filter-group search-group">
                        <label class="filter-label" for="searchInput">
                            Search Category
                        </label>

                        <input
                            class="filter-input"
                            type="text"
                            id="searchInput"
                            placeholder="Search by Category ID or Name"
                        >
                    </div>

                    <button class="search-button" id="searchButton" type="button">
                        Search
                    </button>

                    <div class="filter-group">
                        <label class="filter-label" for="statusFilter">
                            Status
                        </label>

                        <select class="filter-select" id="statusFilter">
                            <option value="all" selected>All</option>
                            <option value="active">Active</option>
                            <option value="suspended">Suspended</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label class="filter-label" for="sortOrder">
                            Sort by Category ID
                        </label>

                        <select class="filter-select" id="sortOrder">
                            <option value="asc" selected>Ascending</option>
                            <option value="desc">Descending</option>
                        </select>
                    </div>

                </div>

            </div>

            <!-- Category Table -->
            <div class="table-wrapper" id="tableWrapper">

                <table class="category-table">

                    <thead>
                        <tr>
                            <th>Category ID</th>
                            <th>Category Name</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="categoryTableBody"></tbody>

                </table>

            </div>

            <!-- Empty State -->
            <div class="empty-state" id="emptyState" hidden>
                No categories found.
            </div>

            <!-- Pagination -->
            <div class="pagination" id="paginationSection" hidden>

                <span class="pagination-info" id="paginationInfo"></span>

                <div class="pagination-controls">

                    <button class="pagination-button" id="previousButton" type="button">
                        Previous
                    </button>

                    <span class="page-number" id="pageNumber"></span>

                    <button class="pagination-button" id="nextButton" type="button">
                        Next
                    </button>

                </div>

            </div>

        </section>

    </main>

</div>

<script>
class ViewIDPCategoriesPage {

    constructor() {

        // Retrieve information supplied by the Boundary
        this.accountId = {{ account_id | default("", true) | tojson }};
        this.username = {{ display_username | tojson }};
        this.categories = {{ categories | default([], true) | tojson }};

        // Search, filter, sorting and pagination settings
        this.searchTerm = "";
        this.statusFilter = "all";
        this.sortOrder = "asc";
        this.currentPage = 1;
        this.pageSize = 5;

        this.filteredCategories = [];

        // Initialise page functions
        this.setupNavigation();
        this.setupSearch();
        this.setupFilters();
        this.setupPagination();
        this.applyFilters();
    }

    // Set up sidebar, Create Category and Logout navigation
    setupNavigation() {

        const params = new URLSearchParams({
            account_id: String(this.accountId),
            username: this.username
        });

        // IDP Category sidebar link
        document.getElementById("categoryLink").href =
            "/platform-manager/categories?" + params.toString();

        // Report sidebar link
        document.getElementById("reportLink").href =
            "/platform-manager/reports?" + params.toString();

        // Create Category button
        document.getElementById("createCategoryLink").href =
            "/platform-manager/categories/create?" + params.toString();

        // Direct logout without confirmation
        document.getElementById("logoutButton").addEventListener(
            "click",
            () => {
                window.location.href = "/";
            }
        );
    }

    // Search is performed only when the Search button is clicked
    setupSearch() {

        const searchInput = document.getElementById("searchInput");
        const searchButton = document.getElementById("searchButton");

        searchButton.addEventListener("click", () => {

            this.searchTerm = searchInput.value.trim().toLowerCase();

            this.currentPage = 1;
            this.applyFilters();
        });

        // Allow Enter to perform the same search
        searchInput.addEventListener("keydown", event => {

            if (event.key === "Enter") {
                event.preventDefault();
                searchButton.click();
            }
        });
    }

    // Set up status and sorting controls
    setupFilters() {

        document.getElementById("statusFilter").addEventListener(
            "change",
            event => {

                this.statusFilter = event.target.value;

                this.currentPage = 1;
                this.applyFilters();
            }
        );

        document.getElementById("sortOrder").addEventListener(
            "change",
            event => {

                this.sortOrder = event.target.value;

                this.currentPage = 1;
                this.applyFilters();
            }
        );
    }

    // Apply search term, status filter and sorting
    applyFilters() {

        this.filteredCategories = this.categories.filter(category => {

            const categoryId = String(category.category_id || "");
            const categoryName = String(
                category.category_name || ""
            ).toLowerCase();

            const categoryStatus = String(
                category.status || ""
            ).toLowerCase();

            // Search Category ID or Category Name
            const matchesSearch =
                categoryId.includes(this.searchTerm) ||
                categoryName.includes(this.searchTerm);

            // Filter by selected status
            const matchesStatus =
                this.statusFilter === "all" ||
                categoryStatus === this.statusFilter;

            return matchesSearch && matchesStatus;
        });

        // Default sorting is ascending by numeric Category ID
        this.filteredCategories.sort((a, b) => {

            const firstId = Number(a.category_id);
            const secondId = Number(b.category_id);

            if (this.sortOrder === "asc") {
                return firstId - secondId;
            }

            return secondId - firstId;
        });

        this.renderCategories();
    }

    // Set up pagination buttons
    setupPagination() {

        document.getElementById("previousButton").addEventListener(
            "click",
            () => {

                if (this.currentPage > 1) {

                    this.currentPage--;
                    this.renderCategories();
                }
            }
        );

        document.getElementById("nextButton").addEventListener(
            "click",
            () => {

                const totalPages = Math.ceil(
                    this.filteredCategories.length / this.pageSize
                );

                if (this.currentPage < totalPages) {

                    this.currentPage++;
                    this.renderCategories();
                }
            }
        );
    }

    // Render category rows for the selected page
    renderCategories() {

        const tableBody = document.getElementById("categoryTableBody");
        const emptyState = document.getElementById("emptyState");
        const tableWrapper = document.getElementById("tableWrapper");
        const paginationSection = document.getElementById("paginationSection");

        tableBody.replaceChildren();

        // Display empty state if no categories match
        if (this.filteredCategories.length === 0) {

            emptyState.hidden = false;
            tableWrapper.hidden = true;
            paginationSection.hidden = true;

            return;
        }

        emptyState.hidden = true;
        tableWrapper.hidden = false;
        paginationSection.hidden = false;

        const startIndex = (this.currentPage - 1) * this.pageSize;

        const pageCategories = this.filteredCategories.slice(
            startIndex,
            startIndex + this.pageSize
        );

        // Create table rows
        pageCategories.forEach(category => {

            const row = document.createElement("tr");

            // Category ID
            const idCell = document.createElement("td");
            idCell.textContent = category.category_id;

            // Category Name
            const nameCell = document.createElement("td");
            nameCell.textContent = category.category_name;

            // Category Status
            const statusCell = document.createElement("td");

            const statusBadge = document.createElement("span");

            statusBadge.textContent = category.status;
            statusBadge.className =
                "status-badge " + String(category.status).toLowerCase();

            statusCell.appendChild(statusBadge);

            // View Category
            const actionCell = document.createElement("td");

            const viewLink = document.createElement("a");

            const params = new URLSearchParams({
                account_id: String(this.accountId),
                username: this.username
            });

            viewLink.href =
                `/platform-manager/categories/${category.category_id}?${params.toString()}`;

            viewLink.className = "view-link";
            viewLink.textContent = "View";

            actionCell.appendChild(viewLink);

            row.append(
                idCell,
                nameCell,
                statusCell,
                actionCell
            );

            tableBody.appendChild(row);
        });

        // Update pagination details
        const totalPages = Math.ceil(
            this.filteredCategories.length / this.pageSize
        );

        const first = startIndex + 1;

        const last = Math.min(
            startIndex + this.pageSize,
            this.filteredCategories.length
        );

        document.getElementById("paginationInfo").textContent =
            `Showing ${first}–${last} of ${this.filteredCategories.length} categories`;

        document.getElementById("pageNumber").textContent =
            `Page ${this.currentPage} of ${totalPages}`;

        document.getElementById("previousButton").disabled =
            this.currentPage === 1;

        document.getElementById("nextButton").disabled =
            this.currentPage === totalPages;
    }
}

// Initialise Category Management page
new ViewIDPCategoriesPage();
</script>

</body>
</html>
